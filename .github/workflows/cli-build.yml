name: Build CLI

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cargo build --locked --bin nebular
