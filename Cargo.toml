[package]
name = "nebula"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Per-turn communication and efficiency metrics stored in SQLite"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
once_cell = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

